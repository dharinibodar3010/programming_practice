<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<script type="text/javascript">
	
	function isalphabet(elem,msg)
	{
		
		var alphaexp = /^[a-zA-Z]+$/;
		
		if(elem.value.match(alphaexp))
		{
			return true;
		}
		else
		{
			alert(msg);
			elem.focus;
			return false;
		}
	
	}
	

</script>

</head>
<body>


<form>
		Enter Name:<input type="text" name="name" id="name"/>
		<input type="submit" value="go" onclick="isalphabet(document.getElementById('name'),'Please Enter Alphabets Only')"/>
</form>

</body>
</html>
