<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<script type="text/javascript">
	
	function isempty(elem,msg)
	{
		if(elem.value.length==0)
		{
			alert(msg);
			elem.focus();
			return false;
		}
		
		return true;
	}
	

</script>

</head>
<body>


<form>
		Enter Name:<input type="text" name="name" id="name"/>
		<input type="submit" value="go" onclick="isempty(document.getElementById('name'),'Please Enter Some Value')"/>
</form>

</body>
</html>
