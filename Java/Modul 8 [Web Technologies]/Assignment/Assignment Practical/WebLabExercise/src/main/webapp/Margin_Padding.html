<!-- CSS: Margin and Padding
3) Create a webpage and use CSS to demonstrate:
	o Margin applied to an element.
	o Padding applied to a div.
	o The effect of different margin and padding values on the layout -->
		
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
	<title>Margin and Padding Demo</title>
	
	<style>
		/* Box 1: Small margin & padding */
		.box1 {
			background-color: lightblue;
			margin: 10px;
			padding: 10px;
			border: 2px solid black;
		}
		
		/* Box 2: Large margin & padding */
		.box2 {
			background-color: lightgreen;
			margin: 40px;
			padding: 30px;
			border: 2px solid black;
		}
		
		/* Box 3: Different margin & padding sides */
		.box3 {
			background-color: lightcoral;
			margin: 20px 50px; /* top-bottom | left-right */
			padding: 50px 25px;
			border: 2px solid black;
		}
	</style>
</head>
<body>

	<h2>Margin and Padding Example</h2>
	<div class="box1">Box 1: Small margin & padding</div>
	<div class="box2">Box 1: Large margin & padding</div>
	<div class="box3">Box 1: Different margin & padding values</div>


</body>
</html>
